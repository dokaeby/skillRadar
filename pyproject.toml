
[project]
name = "skillradar"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pywebpush>=2.0",
    "deep-translator>=1.11",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
    "langfuse>=3.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# main.py: Vercel이 src/를 sys.path에 추가해야 하므로 E402 불가피
"src/backend/main.py" = ["E402"]
# routes.py: FastAPI Depends()를 인자 기본값에 쓰는 것이 공식 패턴
"src/backend/routes.py" = ["B008"]

[tool.vercel]
entrypoint = "src.backend.main:app"
