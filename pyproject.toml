
[project]
name = "skillradar"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pywebpush>=2.0",
    "python-dotenv>=1.0",
    "deep-translator>=1.11",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
    "redis>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.vercel]
entrypoint = "src.backend.main:app"
