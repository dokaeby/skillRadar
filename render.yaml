services:
  - type: web
    name: skillradar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm install --no-audit --no-fund && npm run build
    startCommand: PYTHONPATH=src python -m uvicorn backend.main:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: release
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ADMIN_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
