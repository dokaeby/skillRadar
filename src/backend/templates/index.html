<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkillRadar">
<title>SkillRadar — AI Tooling Trending</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23d97757'/><stop offset='.5' stop-color='%2310a37f'/><stop offset='1' stop-color='%234285f4'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>SR</text></svg>">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { sans: ['Pretendard Variable','Pretendard','system-ui','sans-serif'] },
    colors: {
      claude: '#d97757', chatgpt: '#10a37f', gemini: '#4285f4',
      ink: '#07090f',
    }
  }}
}
</script>
<style>
  :root { color-scheme: light dark; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Pretendard Variable','Pretendard',system-ui,sans-serif;
    background-color: #07090f;
    background-image:
      radial-gradient(900px 420px at 15% -8%, rgba(66,133,244,.14), transparent 60%),
      radial-gradient(800px 400px at 85% -10%, rgba(217,119,87,.10), transparent 60%),
      radial-gradient(700px 380px at 50% 110%, rgba(16,163,127,.08), transparent 60%);
    background-attachment: fixed;
  }
  html.dark body { color: #e2e8f0; }
  html:not(.dark) body {
    background-color: #f6f7f9;
    color: #1e293b;
    background-image:
      radial-gradient(900px 420px at 15% -8%, rgba(66,133,244,.08), transparent 60%),
      radial-gradient(800px 400px at 85% -10%, rgba(217,119,87,.06), transparent 60%);
  }
  ::selection { background: rgba(66,133,244,.35); }
  html.dark ::-webkit-scrollbar { width: 10px; height: 10px; }
  html.dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; border: 2px solid #07090f; }
  html.dark ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid rgba(66,133,244,.7); outline-offset: 2px; border-radius: 6px; }

  .card {
    position: relative;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform .22s cubic-bezier(.22,1,.36,1), border-color .22s ease, box-shadow .22s ease, background .22s ease;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(255,255,255,.16);
    background: rgba(255,255,255,.055);
    box-shadow: 0 12px 40px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  }
  html:not(.dark) .card {
    background: rgba(255,255,255,.75);
    border-color: rgba(15,23,42,.08);
    backdrop-filter: blur(14px);
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -16px rgba(15,23,42,.15);
  }
  html:not(.dark) .card::before { background: linear-gradient(90deg, transparent, rgba(15,23,42,.10), transparent); }
  html:not(.dark) .card:hover { border-color: rgba(15,23,42,.16); box-shadow: 0 14px 40px -16px rgba(15,23,42,.25); }

  .rank-badge {
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  html:not(.dark) .rank-badge { background: rgba(15,23,42,.08); border-color: rgba(15,23,42,.14); box-shadow: none; }

  .tab-active { box-shadow: inset 0 -2px 0 currentColor; }

  .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }
  .fade-up { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
  .fade-up:nth-child(2) { animation-delay:.04s; }
  .fade-up:nth-child(3) { animation-delay:.08s; }
  .fade-up:nth-child(4) { animation-delay:.12s; }
  .fade-up:nth-child(5) { animation-delay:.16s; }
  .fade-up:nth-child(6) { animation-delay:.2s; }
  .fade-up:nth-child(n+7) { animation-delay:.24s; }

  .skeleton { background: linear-gradient(90deg, rgba(148,163,184,.10) 25%, rgba(148,163,184,.20) 50%, rgba(148,163,184,.10) 75%); background-size:200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  .push-btn { transition: all .18s ease; }
  .push-btn:hover { transform: translateY(-1px); }
  .push-btn.subscribed { opacity:.6; }

  .topic-chip { transition: background .15s ease, color .15s ease; }
  .topic-chip:hover { background: rgba(255,255,255,.12); }
  html:not(.dark) .topic-chip:hover { background: rgba(15,23,42,.08); }
</style>
</head>
<body class="text-slate-800 dark:text-slate-200 min-h-screen antialiased">

<!-- 헤더 -->
<header class="sticky top-0 z-20 backdrop-blur-xl bg-white/70 dark:bg-[#07090f]/70 border-b border-slate-200/70 dark:border-white/[.06]">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
    <div class="flex items-center gap-2.5 mr-auto">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-claude via-chatgpt to-gemini flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-black/30 ring-1 ring-white/20">SR</div>
      <div>
        <h1 class="font-bold text-[17px] leading-tight tracking-tight">SkillRadar</h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-500">AI skill · plugin trending</p>
      </div>
    </div>

    <!-- 언어 토글 -->
    <div class="flex rounded-lg border border-slate-200 dark:border-white/10 bg-slate-100/80 dark:bg-white/[.04] overflow-hidden text-xs font-medium p-0.5" id="langToggle">
      <button data-lang="ko" class="px-3 py-1.5 rounded-md bg-white text-slate-900 dark:bg-white dark:text-slate-900 font-semibold">한글</button>
      <button data-lang="en" class="px-3 py-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">EN</button>
      <button data-lang="zh" class="px-3 py-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">中文</button>
    </div>

    <!-- 다크모드 -->
    <button id="themeToggle" class="p-2 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-100/80 dark:bg-white/[.04] text-slate-500 dark:text-slate-300 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200/60 dark:hover:bg-white/[.08] transition-colors" title="테마 전환">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

    <!-- 푸시 구독 -->
    <button id="pushBtn" class="push-btn text-xs font-medium px-3.5 py-2 rounded-lg border border-emerald-600/30 bg-emerald-50 dark:bg-emerald-400/[.08] text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-400/[.15] flex items-center gap-1.5">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="pushBtnLabel">알림 받기</span>
    </button>
  </div>

  <!-- 플랫폼 탭 + 날짜 -->
  <div id="trendBar" class="max-w-7xl mx-auto px-4 pb-3 flex items-center gap-5 flex-wrap">
    <nav class="flex gap-1 text-sm font-semibold" id="platformTabs">
      <button data-platform="claude" class="px-3 py-1.5 rounded-md text-[#b4552d] dark:text-claude tab-active">Claude</button>
      <button data-platform="chatgpt" class="px-3 py-1.5 rounded-md text-[#0b7a5c] dark:text-chatgpt">ChatGPT</button>
      <button data-platform="gemini" class="px-3 py-1.5 rounded-md text-[#2b63d9] dark:text-gemini">Gemini</button>
    </nav>
    <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-500 ml-auto">
      <span>기준일</span>
      <select id="dateSelect" class="bg-white dark:bg-white/[.04] border border-slate-200 dark:border-white/10 rounded-md px-2 py-1 text-xs text-slate-600 dark:text-slate-300"></select>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6">

  <!-- 주제 사이드바 -->
  <aside class="lg:w-60 shrink-0">
    <div class="lg:sticky lg:top-[104px]">
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-500">관심 주제</h2>
        <span class="text-[10px] text-slate-500 dark:text-slate-600">최근 30일</span>
      </div>
      <div id="topicList" class="flex lg:flex-col gap-1 overflow-x-auto lg:overflow-visible pb-2 lg:pb-0 -mx-1 px-1">
        <div class="skeleton h-8 w-32 lg:w-full rounded-lg shrink-0"></div>
        <div class="skeleton h-8 w-28 lg:w-full rounded-lg shrink-0"></div>
        <div class="skeleton h-8 w-36 lg:w-full rounded-lg shrink-0"></div>
        <div class="skeleton h-8 w-24 lg:w-full rounded-lg shrink-0"></div>
        <div class="skeleton h-8 w-32 lg:w-full rounded-lg shrink-0"></div>
      </div>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="flex-1 min-w-0">
    <!-- 주제 상세 헤더 (선택 시 표시) -->
    <div id="topicHeader" class="hidden mb-4">
      <button id="topicBack" class="text-xs text-slate-500 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 mb-2 inline-flex items-center gap-1 transition-colors">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        트렌딩으로 돌아가기
      </button>
      <div class="flex items-center gap-3 flex-wrap">
        <h2 id="topicTitle" class="text-lg font-bold tracking-tight"></h2>
        <span id="topicCount" class="text-[11px] px-2 py-0.5 rounded-full bg-white/[.06] border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-400"></span>
      </div>
      <div id="topicPlatformTabs" class="flex gap-1 mt-3 text-xs font-semibold">
        <button data-tplatform="all" class="px-3 py-1.5 rounded-md bg-slate-200/70 dark:bg-white/[.08] text-slate-800 dark:text-slate-200">전체</button>
        <button data-tplatform="claude" class="px-3 py-1.5 rounded-md text-[#b4552d] dark:text-claude">Claude</button>
        <button data-tplatform="chatgpt" class="px-3 py-1.5 rounded-md text-[#0b7a5c] dark:text-chatgpt">ChatGPT</button>
        <button data-tplatform="gemini" class="px-3 py-1.5 rounded-md text-[#2b63d9] dark:text-gemini">Gemini</button>
      </div>
      <div id="relatedTopics" class="flex gap-1.5 mt-3 flex-wrap"></div>
    </div>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    <div id="empty" class="hidden text-center py-24">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-white/[.04] border border-white/10 flex items-center justify-center text-2xl mb-4">📡</div>
      <p class="text-base font-semibold text-slate-300 dark:text-slate-300" id="emptyTitle">아직 수집된 데이터가 없습니다</p>
      <p class="text-sm mt-1.5 text-slate-600 dark:text-slate-500" id="emptyDesc">매일 KST 06:00 자동 수집되거나, 관리자가 /api/admin/refresh를 호출하세요.</p>
    </div>
  </main>
</div>

<footer class="max-w-7xl mx-auto px-4 pb-8 text-[11px] text-slate-500 dark:text-slate-600 flex justify-between flex-wrap gap-2">
  <span>GitHub Search API · 일일 Top 10 · LLM 3줄 요약</span>
  <span id="updatedAt"></span>
</footer>

<script src="/static/app.js?v=5" defer></script>
<script src="/static/push.js?v=5" defer></script>
</body>
</html>
